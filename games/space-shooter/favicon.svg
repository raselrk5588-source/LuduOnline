<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background - space dark -->
  <rect width="512" height="512" rx="96" fill="#0a0a23"/>
  <!-- Stars -->
  <circle cx="80" cy="90" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="420" cy="70" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="350" cy="430" r="4" fill="#fff" opacity="0.7"/>
  <circle cx="130" cy="400" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="60" cy="300" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="450" cy="250" r="4" fill="#fff" opacity="0.7"/>
  <!-- Spaceship body -->
  <polygon points="256,80 200,320 256,280 312,320" fill="#00d2ff"/>
  <polygon points="256,80 200,320 256,280 312,320" fill="url(#shipGrad)"/>
  <!-- Wings -->
  <polygon points="200,320 140,400 200,280" fill="#6c5ce7"/>
  <polygon points="312,320 372,400 312,280" fill="#6c5ce7"/>
  <!-- Flame -->
  <ellipse cx="256" cy="340" rx="30" ry="60" fill="#f39c12" opacity="0.9"/>
  <ellipse cx="256" cy="330" rx="18" ry="40" fill="#e74c3c" opacity="0.9"/>
  <ellipse cx="256" cy="320" rx="10" ry="24" fill="#fff" opacity="0.8"/>
  <!-- Shield glow -->
  <circle cx="256" cy="200" r="24" fill="#00d2ff" opacity="0.3"/>
  <circle cx="256" cy="200" r="12" fill="#fff" opacity="0.6"/>
  <defs>
    <linearGradient id="shipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
  </defs>
</svg>
