<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিড়াল দৌড় 3D</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = '../../index.html';
        }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer">
            <a href="../../index.html" style="position:absolute; top:20px; left:20px; color:white; font-size:28px; text-decoration:none; font-weight:bold; z-index:100; pointer-events:auto; text-shadow: 0 0 10px rgba(0,242,254,0.8);">❮</a>
            
            <div id="hud" class="hidden">
                <div class="score-board">স্কোর: <span id="score-val">0</span></div>
            </div>

            <div id="start-menu" class="bg-image-screen">
                <div class="logo-container">
                    <div class="cartoon-title-top">বিড়াল</div>
                    <div class="cartoon-title-bottom">দৌড়</div>
                </div>
                <div id="start-btn" class="tap-to-play">খেলতে ট্যাপ করুন</div>
            </div>

            <div id="game-over-menu" class="glass-panel hidden">
                <h1>গেম ওভার</h1>
                <p>চূড়ান্ত স্কোর: <span id="final-score">0</span></p>
                <button id="restart-btn">আবার খেলুন</button>
            </div>
        </div>
    </div>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
